<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 214" role="img" aria-label="Cache-line occupancy of MissileGood versus MissileBad on 128-byte lines">
<title>Struct size vs the 128-byte cache line</title>
<desc>Two 128-byte cache lines drawn as a track. MissileGood (128 bytes) fills exactly one cache line, so reading an element touches a single line. MissileBad (136 bytes) fills the first line and spills 8 bytes past the boundary into a second line, so reading an element touches two cache lines — roughly double the L1D misses.</desc>
<text xml:space="preserve" style="font-family:ui-monospace,monospace;font-size:13px" x="46.0" y="22" dominant-baseline="central"><tspan style="fill:#a6e3a1;font-weight:600">MissileGood</tspan><tspan style="fill:#a6adc8">  128 B</tspan></text>
<text style="fill:#a6e3a1;font-family:ui-monospace,monospace;font-size:12px" x="634.8" y="22" text-anchor="end" dominant-baseline="central">fits 1 line ✓</text>
<rect x="46.0" y="34" width="294.4" height="34" rx="6" fill="#1e1e2e" fill-opacity="0.5" stroke="#45475a" stroke-width="1.1"></rect>
<rect x="340.4" y="34" width="294.4" height="34" rx="6" fill="#1e1e2e" fill-opacity="0.5" stroke="#45475a" stroke-width="1.1"></rect>
<rect x="46.0" y="38" width="294.4" height="26" rx="4" fill="#94e2d5" fill-opacity="0.30" stroke="#94e2d5" stroke-width="1.2"></rect>
<path d="M340.4,28 V74" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4 3"></path>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="193.2" y="84" text-anchor="middle" dominant-baseline="central">cache line 0</text>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="487.6" y="84" text-anchor="middle" dominant-baseline="central">cache line 1</text>
<text xml:space="preserve" style="font-family:ui-monospace,monospace;font-size:13px" x="46.0" y="116" dominant-baseline="central"><tspan style="fill:#f38ba8;font-weight:600">MissileBad</tspan><tspan style="fill:#a6adc8">  136 B</tspan></text>
<text style="fill:#f38ba8;font-family:ui-monospace,monospace;font-size:12px" x="634.8" y="116" text-anchor="end" dominant-baseline="central">spans 2 lines ✗</text>
<rect x="46.0" y="128" width="294.4" height="34" rx="6" fill="#1e1e2e" fill-opacity="0.5" stroke="#45475a" stroke-width="1.1"></rect>
<rect x="340.4" y="128" width="294.4" height="34" rx="6" fill="#1e1e2e" fill-opacity="0.5" stroke="#45475a" stroke-width="1.1"></rect>
<rect x="46.0" y="132" width="294.4" height="26" rx="4" fill="#94e2d5" fill-opacity="0.30" stroke="#94e2d5" stroke-width="1.2"></rect>
<rect x="340.4" y="132" width="18.4" height="26" rx="4" fill="#f38ba8" fill-opacity="0.55" stroke="#f38ba8" stroke-width="1.3"></rect>
<path d="M340.4,122 V168" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4 3"></path>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="193.2" y="178" text-anchor="middle" dominant-baseline="central">cache line 0</text>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="487.6" y="178" text-anchor="middle" dominant-baseline="central">cache line 1</text>
<path d="M349.6,124 V112" stroke="#f38ba8" stroke-width="1"></path>
<text style="fill:#f38ba8;font-family:ui-monospace,monospace;font-size:10.5px" x="353.6" y="106" dominant-baseline="central">8 B tail spills over</text>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="340" y="202" text-anchor="middle" dominant-baseline="central">reading a MissileBad element touches 2 cache lines</text>
</svg>
