<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 136" role="img" aria-label="Benchmark comparing MissileGood and MissileBad CPU counters">
<title>MissileGood vs MissileBad benchmark (kperf counters)</title>
<desc>Same update loop over an array of each struct. MissileBad (136 B) runs 16.66 ms vs MissileGood (128 B) at 13.76 ms, burning 76.4M vs 62.0M cycles on near-identical instruction counts, because it suffers 17.72M vs 6.39M L1D load misses and 6.46M vs 2.56M store misses.</desc>
