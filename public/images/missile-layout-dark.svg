<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:10.5px" x="141" y="324" dominant-baseline="central">float</text>
<rect x="189" y="316" width="14" height="11" rx="2.5" fill="#89b4fa" fill-opacity="0.16" stroke="#89b4fa" stroke-width="1.2"></rect>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:10.5px" x="209" y="324" dominant-baseline="central">double</text>
<rect x="263" y="316" width="14" height="11" rx="2.5" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:10.5px" x="283" y="324" dominant-baseline="central">padding</text>
<rect x="343" y="316" width="14" height="11" rx="2.5" fill="#cba6f7" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:10.5px" x="363" y="324" dominant-baseline="central">hot</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:10px" x="604" y="324" text-anchor="end" dominant-baseline="central">each row = one 64 B cache line</text>
</svg>
