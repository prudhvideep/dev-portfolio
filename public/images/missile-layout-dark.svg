<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img" aria-label="Byte-level memory layout of MissileGood versus MissileBad">
<title>MissileGood vs MissileBad memory layout</title>
<desc>Two structs with identical fields in a different order, drawn as a byte grid where each 64-byte row is one cache line. MissileGood packs both bool flags at the front and fits in 128 bytes / 2 cache lines with is_visible, fuel and is_disabled all in line 0. MissileBad puts is_disabled after the doubles, growing the struct to 136 bytes / 3 cache lines and pushing that flag alone into cache line 2.</desc>
<defs><pattern id="pad-d" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f38ba8" fill-opacity="0.07"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#f38ba8" stroke-width="1.3" stroke-opacity="0.55"></line></pattern></defs>
<text xml:space="preserve" style="font-family:ui-monospace,monospace;font-size:13px" x="8" y="24" dominant-baseline="central"><tspan style="fill:#cba6f7">struct </tspan><tspan style="fill:#cdd6f4">MissileGood</tspan></text>
<text style="fill:#a6e3a1;font-family:ui-monospace,monospace;font-size:12px" x="604" y="24" text-anchor="end" dominant-baseline="central">128 B → 2 cache lines</text>
<rect x="60.00" y="54.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.16" stroke="#cba6f7" stroke-width="1.2"></rect>
<rect x="68.50" y="54.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.16" stroke="#cba6f7" stroke-width="1.2"></rect>
<rect x="77.00" y="54.0" width="17.00" height="26" rx="3" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<rect x="94.00" y="54.0" width="510.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.16" stroke="#94e2d5" stroke-width="1.2"></rect>
<rect x="60.00" y="86.0" width="238.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.16" stroke="#94e2d5" stroke-width="1.2"></rect>
<rect x="298.00" y="86.0" width="34.00" height="26" rx="3" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<rect x="332.00" y="86.0" width="272.00" height="26" rx="3" fill="#89b4fa" fill-opacity="0.16" stroke="#89b4fa" stroke-width="1.2"></rect>
<text style="fill:#94e2d5;font-family:ui-monospace,monospace;font-size:11px" x="213.0" y="67.0" text-anchor="middle" dominant-baseline="central">22 floats · 88 B</text>
<text style="fill:#89b4fa;font-family:ui-monospace,monospace;font-size:11px" x="1007.8" y="99.0" text-anchor="middle" dominant-baseline="central">4 doubles · 32 B</text>
<rect x="60.00" y="54.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<rect x="68.50" y="54.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<rect x="366.00" y="54.0" width="34.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<text style="fill:#a6adc8;font-family:ui-monospace,monospace;font-size:10px" x="54" y="63.0" text-anchor="end" dominant-baseline="central">line 0</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:9px" x="54" y="74.0" text-anchor="end" dominant-baseline="central">byte 0</text>
<text style="fill:#a6adc8;font-family:ui-monospace,monospace;font-size:10px" x="54" y="95.0" text-anchor="end" dominant-baseline="central">line 1</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:9px" x="54" y="106.0" text-anchor="end" dominant-baseline="central">byte 64</text>
<path d="M68.5,53.0 V48.0" fill="none" stroke="#cba6f7" stroke-width="1"></path>
<text style="fill:#cba6f7;font-family:ui-monospace,monospace;font-size:9.5px" x="68.5" y="41.0" text-anchor="start" dominant-baseline="central">is_visible, is_disabled</text>
<path d="M383.0,53.0 V48.0" fill="none" stroke="#94e2d5" stroke-width="1"></path>
<text style="fill:#94e2d5;font-family:ui-monospace,monospace;font-size:9.5px" x="383.0" y="41.0" text-anchor="middle" dominant-baseline="central">fuel</text>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="332" y="128" text-anchor="middle" dominant-baseline="central">flags packed up front · loop reads is_visible + fuel, writes is_disabled — all in cache line 0</text>
<text xml:space="preserve" style="font-family:ui-monospace,monospace;font-size:13px" x="8" y="158" dominant-baseline="central"><tspan style="fill:#cba6f7">struct </tspan><tspan style="fill:#cdd6f4">MissileBad</tspan></text>
<text style="fill:#f38ba8;font-family:ui-monospace,monospace;font-size:12px" x="604" y="158" text-anchor="end" dominant-baseline="central">136 B → 3 cache lines</text>
<rect x="60.00" y="188.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.16" stroke="#cba6f7" stroke-width="1.2"></rect>
<rect x="68.50" y="188.0" width="25.50" height="26" rx="3" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<rect x="94.00" y="188.0" width="510.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.16" stroke="#94e2d5" stroke-width="1.2"></rect>
<rect x="60.00" y="220.0" width="238.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.16" stroke="#94e2d5" stroke-width="1.2"></rect>
<rect x="298.00" y="220.0" width="34.00" height="26" rx="3" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<rect x="332.00" y="220.0" width="272.00" height="26" rx="3" fill="#89b4fa" fill-opacity="0.16" stroke="#89b4fa" stroke-width="1.2"></rect>
<rect x="60.00" y="252.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.16" stroke="#cba6f7" stroke-width="1.2"></rect>
<rect x="68.50" y="252.0" width="59.50" height="26" rx="3" fill="url(#pad-d)" stroke="#f38ba8" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 2"></rect>
<text style="fill:#94e2d5;font-family:ui-monospace,monospace;font-size:11px" x="213.0" y="201.0" text-anchor="middle" dominant-baseline="central">22 floats · 88 B</text>
<text style="fill:#89b4fa;font-family:ui-monospace,monospace;font-size:11px" x="1007.8" y="233.0" text-anchor="middle" dominant-baseline="central">4 doubles · 32 B</text>
<rect x="60.00" y="188.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<rect x="366.00" y="188.0" width="34.00" height="26" rx="3" fill="#94e2d5" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<rect x="60.00" y="252.0" width="8.50" height="26" rx="3" fill="#cba6f7" fill-opacity="0.9" stroke="#f9e2af" stroke-width="1.7"></rect>
<text style="fill:#a6adc8;font-family:ui-monospace,monospace;font-size:10px" x="54" y="197.0" text-anchor="end" dominant-baseline="central">line 0</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:9px" x="54" y="208.0" text-anchor="end" dominant-baseline="central">byte 0</text>
<text style="fill:#a6adc8;font-family:ui-monospace,monospace;font-size:10px" x="54" y="229.0" text-anchor="end" dominant-baseline="central">line 1</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:9px" x="54" y="240.0" text-anchor="end" dominant-baseline="central">byte 64</text>
<text style="fill:#a6adc8;font-family:ui-monospace,monospace;font-size:10px" x="54" y="261.0" text-anchor="end" dominant-baseline="central">line 2</text>
<text style="fill:#6c7086;font-family:ui-monospace,monospace;font-size:9px" x="54" y="272.0" text-anchor="end" dominant-baseline="central">byte 128</text>
<path d="M64.2,187.0 V182.0" fill="none" stroke="#cba6f7" stroke-width="1"></path>
<text style="fill:#cba6f7;font-family:ui-monospace,monospace;font-size:9.5px" x="64.2" y="175.0" text-anchor="start" dominant-baseline="central">is_visible</text>
<path d="M383.0,187.0 V182.0" fill="none" stroke="#94e2d5" stroke-width="1"></path>
<text style="fill:#94e2d5;font-family:ui-monospace,monospace;font-size:9.5px" x="383.0" y="175.0" text-anchor="middle" dominant-baseline="central">fuel</text>
<path d="M138,265.0 H72" fill="none" stroke="#cba6f7" stroke-width="1" marker-start="none"></path>
<path d="M78,262.0 L72,265.0 L78,268.0" fill="none" stroke="#cba6f7" stroke-width="1"></path>
<text xml:space="preserve" style="font-family:ui-monospace,monospace;font-size:11px" x="144" y="265.0" dominant-baseline="central"><tspan style="fill:#cba6f7">is_disabled</tspan><tspan style="fill:#7f849c"> — alone in cache line 2, forces 7 B tail padding</tspan></text>
<text style="fill:#7f849c;font-family:ui-monospace,monospace;font-size:11px" x="332" y="300" text-anchor="middle" dominant-baseline="central">is_disabled trails the doubles · loop straddles cache lines 0 and 2, and every missile is 8 B fatter</text>
